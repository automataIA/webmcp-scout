[project]
name = "local-router"
version = "0.1.0"
description = "LoRA decision model for the local router: answers the hybrid router's closed questions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "transformers==4.57.6",
    "accelerate==1.14.0",
    "peft",
    "numpy>=1.24,<2.0",
    "optuna==5.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
