name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/overview.html
      - docs/images/**
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The site is the overview page and the media it uses, nothing else
      # from docs/.
      - name: Assemble site
        run: |
          mkdir _site
          cp docs/overview.html _site/index.html
          cp -r docs/images docs/media _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
