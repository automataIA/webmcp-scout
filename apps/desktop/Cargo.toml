# Separate workspace: the Tauri shell needs WebKitGTK and the UI builds for
# wasm, so the core workspace stays buildable without either.
[workspace]
members = ["ui", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/automataIA/webmcp-scout"

[workspace.dependencies]
scout-types = { path = "../../crates/scout-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
