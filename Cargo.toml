[workspace]
members = ["crates/scout", "crates/scout-types", "apps/scout-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/automataIA/webmcp-scout"

[workspace.dependencies]
scout = { path = "crates/scout" }
scout-types = { path = "crates/scout-types" }
anyhow = "1.0.104"
axum = "0.8.9"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
insta = { version = "1.48.0", features = ["json"] }
jsonschema = { version = "0.58.0", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
